[project]
name = "misfire-skills"
version = "0.2.0"
description = "Trigger testing for Claude skills — a skill that never fires is just a well-formatted file."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "pyyaml>=6.0"]
license = {text = "MIT"}
keywords = ["claude", "skills", "testing", "agents", "prompts"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/saraolive/misfire"
Repository = "https://github.com/saraolive/misfire"
Issues = "https://github.com/saraolive/misfire/issues"

[project.scripts]
misfire = "misfire:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["misfire"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
